<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Nemeceren app icon: a speech bubble whose "Ä" has googly-eye umlaut dots. Drawn with shapes, no fonts. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD84D"/>
      <stop offset="1" stop-color="#FF7A3D"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B7BF0"/>
      <stop offset="1" stop-color="#1D4FB8"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- the dotted path that leads to the bubble (the course as a path) -->
    <path d="M40 486 C 110 452, 150 446, 196 428" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 26" opacity="0.75"/>
    <!-- bubble shadow -->
    <path d="M144 148 h232 a52 52 0 0 1 52 52 v116 a52 52 0 0 1 -52 52 h-104 l-60 52 v-52 h-68 a52 52 0 0 1 -52 -52 v-116 a52 52 0 0 1 52 -52 z" fill="#000" opacity="0.14" transform="translate(6 10)"/>
    <!-- bubble -->
    <path d="M144 148 h232 a52 52 0 0 1 52 52 v116 a52 52 0 0 1 -52 52 h-104 l-60 52 v-52 h-68 a52 52 0 0 1 -52 -52 v-116 a52 52 0 0 1 52 -52 z" fill="url(#bubble)"/>
    <!-- the A, drawn as a rounded stroke -->
    <path d="M200 334 L256 222 L312 334 M222 292 H290" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- the umlaut dots as googly eyes, looking up and to the right -->
    <circle cx="224" cy="186" r="25" fill="#fff"/>
    <circle cx="288" cy="186" r="25" fill="#fff"/>
    <circle cx="231" cy="180" r="12" fill="#1b1f24"/>
    <circle cx="295" cy="180" r="12" fill="#1b1f24"/>
    <circle cx="235" cy="176" r="4" fill="#fff"/>
    <circle cx="299" cy="176" r="4" fill="#fff"/>
    <!-- blushing cheeks -->
    <ellipse cx="180" cy="300" rx="18" ry="11" fill="#FF8FB8" opacity="0.8"/>
    <ellipse cx="332" cy="300" rx="18" ry="11" fill="#FF8FB8" opacity="0.8"/>
    <!-- a sparkle -->
    <path d="M384 108 q6 22 28 28 q-22 6 -28 28 q-6 -22 -28 -28 q22 -6 28 -28 z" fill="#fff"/>
    <circle cx="420" cy="182" r="7" fill="#fff" opacity="0.85"/>
  </g>
</svg>
