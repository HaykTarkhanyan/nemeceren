<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1f5fbf" />
    <!-- Installable app (DECISIONS.md #89): relative paths, so they work under /nemeceren/. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Nemeceren - German practice</title>
    <script>
      // Light or dark before the first paint (no flash). src/lib/theme.ts owns the theme after
      // that, with the same key and values, and reports it if storage cannot be read.
      ;(function () {
        var t = 'system'
        try {
          t = localStorage.getItem('nemeceren.theme') || 'system'
        } catch (e) {}
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
